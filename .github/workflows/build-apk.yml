name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # يتيح لك تشغيل البناء يدوياً من تبويب Actions

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. سحب كود المشروع
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. إعداد بيئة جافا (JDK 17 مناسب لأغلب مشاريع أندرويد الحديثة)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. منح صلاحيات التنفيذ لـ Gradle Wrapper
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 4. بناء ملف APK (نسخة Debug افتراضياً)
      - name: Build Debug APK
        run: ./gradlew assembleDebug

      # 5. رفع ملف APK الناتج كملف مرفق (Artifact) ليمكنك تحميله
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
